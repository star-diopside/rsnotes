spring:
  liquibase:
    url: jdbc:postgresql://localhost:5432/rsnotesdb
    user: rsnotes
    password: rsnotes
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/rsnotesdb
    username: rsnotes
    password: rsnotes
  codec:
    log-request-details: true

logging:
  file:
    name: ${user.home}/logs/rsnotes/web-app.log
  group:
    r2dbc:
      - "org.springframework.r2dbc"
      - "org.springframework.data.r2dbc"
  level:
    web: DEBUG
    r2dbc: DEBUG
    "[jp.gr.java_conf.stardiopside.rsnotes]": DEBUG
